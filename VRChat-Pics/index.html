<script>document.getElementById('year').textContent=new Date().getFullYear();const cards=[...document.querySelectorAll('.photo-card')],modal=document.getElementById('photo-modal'),modalImage=document.getElementById('modal-image'),modalCaption=document.getElementById('modal-caption');let current=0,lastFocus=null;function show(index){current=(index+cards.length)%cards.length;const card=cards[current];modalImage.src=card.dataset.img;modalImage.alt=card.querySelector('img').alt;modalCaption.textContent=card.dataset.caption;}function openModal(index){lastFocus=document.activeElement;show(index);modal.hidden=false;requestAnimationFrame(()=>modal.classList.add('open'));document.body.style.overflow='hidden';modal.querySelector('.close').focus();}function closeModal(){modal.classList.remove('open');modal.hidden=true;document.body.style.overflow='';if(lastFocus)lastFocus.focus();}cards.forEach((card,i)=>card.addEventListener('click',()=>openModal(i)));modal.querySelector('.close').addEventListener('click',closeModal);modal.querySelector('.prev').addEventListener('click',()=>show(current-1));modal.querySelector('.next').addEventListener('click',()=>show(current+1));modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});document.addEventListener('keydown',e=>{if(modal.hidden)return;if(e.key==='Escape')closeModal();if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1);});</script></body></html>
